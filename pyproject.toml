[project]
name = "althing"
dynamic = ["version"]
description = "Run synthetic focus groups using AI personas, with an MCP server for Claude Code / Cursor / Windsurf. CLI tool, Python library, any LLM."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DataViking", email = "openclaw@dataviking.tech"}]
readme = "README.md"
keywords = ["llm", "research", "focus-group", "synthetic", "personas", "user-research", "ai", "mcp", "model-context-protocol", "agent", "claude", "claude-code", "cursor", "windsurf", "survey-research", "synthetic-respondents", "market-research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "puremagic>=1.20",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://althing.dev"
Documentation = "https://althing.dev"
Repository = "https://github.com/DataViking-Tech/Althing"
Issues = "https://github.com/DataViking-Tech/Althing/issues"
Changelog = "https://github.com/DataViking-Tech/Althing/releases"
"MCP Reference" = "https://github.com/DataViking-Tech/Althing/blob/main/docs/mcp.md"
Funding = "https://ko-fi.com/dataviking"

[project.optional-dependencies]
# `full` is the fetch/extract path. Pulls `trafilatura`, which transitively
# requires `lxml` (C extension). Excluded from core deps so that bare
# `pip install althing` stays installable in pyodide / Cloudflare
# Python Workers, where the curated CPython set doesn't include `lxml`.
# Callers that need the URL-attachment ladder install
# `pip install althing[full]`. The fetch ladder degrades to the
# screenshot path (or returns `None`) when trafilatura is missing, so
# this is a soft optional — althing.ensemble keeps working without it.
full = [
    "trafilatura>=1.10",
]
mcp = [
    "mcp>=1.0",
]
composio = [
    # Composio's experimental Toolkit API is the surface this integration
    # binds to (`composio_client.experimental.Toolkit` + `@toolkit.tool()`).
    # That surface is still labelled experimental upstream and the adapter
    # gates calls behind a runtime check, so a strict pin here mostly
    # creates resolver friction without preventing breakage. The historical
    # `composio>=0.5,<0.6` pin became unsatisfiable when upstream yanked
    # the 0.5.x line — published composio versions now jump from 0.1.x to
    # 0.8.x. We track the available stable line and let the adapter's
    # `experimental.Toolkit` guard catch any drift at construction time.
    # See docs/composio-submission.md for the upstream-drift triage
    # checklist.
    "composio>=0.8",
    "pydantic>=2.0,<3.0",
]
convergence = [
    # CAUTION: the distribution named `synthbench` on PyPI is an UNRELATED
    # project (synthetic ML datasets). The real SynthBench harness this
    # extra targets is GitHub-only:
    #   pip install "synthbench @ git+https://github.com/DataViking-Tech/SynthBench.git"
    # PyPI rejects direct-URL requirements in published wheels, so the
    # loose name pin stays here for resolver compatibility; every consumer
    # of the harness (convergence baseline loader, synthbench_submit
    # metrics) probes for the real API at runtime and degrades gracefully
    # when the wrong distribution shadows the name. CI's
    # `synthbench-contract` job installs the real harness from git.
    "synthbench>=0.1",
]
pdf = [
    # pypdfium2 wraps Google's PDFium under Apache-2.0 / BSD-3-Clause and
    # ships pre-built wheels for linux/mac/win without a system binary.
    # Picked over PyMuPDF (AGPL-3.0 blocks SaaS distribution) and
    # pdf2image (requires Poppler). See hq-31t8 §1 for the full rationale.
    "pypdfium2>=4.30",
    # Pillow is used to encode rendered page bitmaps as PNG for the
    # page-as-image fallback (scanned PDFs).
    "Pillow>=10.0",
]
report = []
visual = [
    # Optional Playwright + headless Chromium for the URL-attachment
    # ladder's screenshot step (hq-hqlp §1, step 3). Adds ~80 MB of
    # browser shell on install (`playwright install --with-deps chromium`),
    # which is why this stays opt-in. The fetch ladder degrades to
    # text-only when the import is missing.
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "tomli>=2.0; python_version<'3.11'",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
    # Pulled in so the fetch-ladder regression tests still exercise the
    # `trafilatura` path. Production callers opt in via `althing[full]`.
    "trafilatura>=1.10",
]

[project.scripts]
althing = "althing.main:main"
# Deprecated alias from the SynthPanel → Althing rename; removed next major.
synthpanel = "althing.main:main_deprecated_synthpanel"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "althing.__version__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"althing.packs" = ["*.yaml"]
"althing.packs.instruments" = ["*.yaml"]
"althing.schemas" = ["*.json"]
"althing.data" = ["*.json"]
"althing.agent_assets" = [
    "commands/*.md",
    "skills/concept-test/*.md",
    "skills/focus-group/*.md",
    "skills/name-test/*.md",
    "skills/pricing-probe/*.md",
    "skills/survey-prescreen/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not acceptance and not install_smoke' --cov=althing --cov-report=term-missing --cov-fail-under=80"
markers = [
    "acceptance: live API acceptance tests (require ANTHROPIC_API_KEY)",
    "install_smoke: slow fresh-venv install validation (sy-6kr); opt in with `-m install_smoke`",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
    "SIM108", # ternary operator (readability preference)
    "RUF003", # ambiguous unicode in comments (intentional)
    "RUF012", # mutable class default (dataclass fields)
    "B905",   # zip-without-explicit-strict (compat with Python <3.10)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E402",   # module-level imports after env setup
    "B017",   # assert blind exception in tests
    "RUF043", # pytest.raises ambiguous pattern
]

[tool.ruff.lint.isort]
known-first-party = ["althing"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/althing"]
disable_error_code = [
    "import-untyped",
    "no-any-return",
    "union-attr",
    "arg-type",
    "return-value",
    "assignment",
    "var-annotated",
]
