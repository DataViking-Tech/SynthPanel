name: Auto Semver Tag

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  auto-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      checks: read
      actions: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      skipped: ${{ steps.check.outputs.skipped }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Parse semver labels
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Fetch labels via gh API rather than reading
          # github.event.pull_request.labels from the event payload. `gh run
          # rerun` replays the original payload, so labels added after the
          # initial merge (the recovery path for a missing semver label) are
          # invisible to the rerun otherwise. See sy-73j.
          LABELS=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '[.labels[].name]')
          echo "Labels (fresh fetch): $LABELS"

          SEMVER_LABELS=$(echo "$LABELS" | jq -r '.[] | select(startswith("semver:"))' | grep -v '^semver:skip$' || true)
          SKIP=$(echo "$LABELS" | jq -r '.[] | select(. == "semver:skip")' || true)

          if [ -n "$SKIP" ]; then
            echo "semver:skip label found — skipping release"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(echo "$SEMVER_LABELS" | grep -c . || true)

          if [ "$COUNT" -eq 0 ]; then
            # Every merged PR MUST carry an explicit semver:* label
            # (patch/minor/major to bump, or semver:skip to opt out). Prior
            # behaviour silently skipped on missing label, which hid two
            # release misses (v0.9.2 / PR #163 — sp-42i, and PR #453 — sy-73j)
            # behind a green check. Fail loud so the merging mayor sees a red
            # ❌ on the PR and remediates before the omission ships.
            echo "::error::PR #${PR_NUMBER} '$PR_TITLE' merged without a semver label. Add semver:patch, semver:minor, semver:major, or semver:skip and re-run this workflow."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Multiple semver labels found: $(echo $SEMVER_LABELS | tr '\n' ', '). Use exactly one."
            exit 1
          fi

          BUMP="${SEMVER_LABELS#semver:}"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "Bump type: $BUMP"

      - name: Verify CI checks passed
        if: steps.check.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Verifying CI status for PR head commit: $HEAD_SHA"

          RUNS=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
            --paginate --jq '.check_runs[] | select(.name != "auto-tag") | {name: .name, status: .status, conclusion: .conclusion}')

          if [ -z "$RUNS" ]; then
            echo "::error::No CI check runs found for commit $HEAD_SHA — refusing to tag"
            exit 1
          fi

          echo "Check runs:"
          echo "$RUNS" | jq -s '.'

          INCOMPLETE=$(echo "$RUNS" | jq -s '[.[] | select(.status != "completed")] | length')
          if [ "$INCOMPLETE" -gt 0 ]; then
            echo "::error::${INCOMPLETE} check(s) still running — refusing to tag"
            echo "$RUNS" | jq -s '[.[] | select(.status != "completed")]'
            exit 1
          fi

          FAILED=$(echo "$RUNS" | jq -s '[.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length')
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} check(s) did not pass — refusing to tag"
            echo "$RUNS" | jq -s '[.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")]'
            exit 1
          fi

          echo "All CI checks passed ✓"

      - name: Compute next version
        if: steps.check.outputs.skipped != 'true'
        id: bump
        env:
          BUMP: ${{ steps.check.outputs.bump }}
        run: |
          LATEST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)

          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
            echo "No existing tags found — starting from v0.0.0"
          fi
          echo "Latest tag: $LATEST"

          VERSION="${LATEST#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "::error::Unknown bump type: $BUMP"
              exit 1
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "New tag: $NEW_TAG"

      # Sync src/synth_panel/__version__.py (and the rendered landing page,
      # which derives from it) to the new tag BEFORE tagging. pyproject.toml
      # uses `version = {attr = "synth_panel.__version__.__version__"}`, so
      # the build's package version is whatever this file says at the tagged
      # SHA. Without this step, the tagged commit carries the previous
      # version string and the resulting sdist/wheel is named after the
      # previous release — which, since sy-4qa adopted python-publish.yml's
      # `skip-existing: true`, now silently no-ops at PyPI instead of going
      # red. See sy-r87.
      - name: Bump __version__.py and re-render every version artifact
        if: steps.check.outputs.skipped != 'true'
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          VERSION="${NEW_TAG#v}"
          printf '__version__ = "%s"\n' "$VERSION" > src/synth_panel/__version__.py
          # Keep every committed artifact that embeds the version in
          # lockstep. The v1.5.0 manual cut needed three follow-up PRs
          # (#488 #489 #490) because only site/index.html was synced
          # here. Each renderer below is stdlib-only Python so they run
          # without a setup-python step.
          #
          # 1. site/index.html — landing page hero + JSON-LD.
          python scripts/render_site.py
          # 2. site/index.md (and every other site/**/*.md) — the
          #    content-negotiation worker serves these on Accept:
          #    text/markdown. Drift here fails
          #    tests/test_site_markdown.py::test_committed_markdown_matches_fresh_render.
          python scripts/render_site_markdown.py
          # 3. site/.well-known/mcp/server-card.json — the MCP discovery
          #    document. Three version fields (top, serverInfo, packages[]).
          #    Drift fails tests/test_well_known_server_card.py::test_versions_match_package_version.
          python scripts/render_server_card.py
          # sy-hs4: any future "render X with the version" script must be
          # added here AND covered by tests/test_version_artifacts_in_sync.py
          # so the next release doesn't need a manual follow-up PR.

      # Mint a token for the org-owned `dataviking-release-bot` App. The App is
      # an Integration bypass actor on the main branch ruleset (see
      # dataviking-infra synthpanel.tf), so pushing the bump commit AS the App
      # is allowed — whereas a github-actions[bot] / GITHUB_TOKEN push to main
      # is rejected with GH013. This removed the manual "pre-bump the version in
      # the PR" workaround (the escape-hatch branch below still works if a PR
      # happens to be pre-bumped, but it is no longer required).
      - name: Mint release-bot app token
        if: steps.check.outputs.skipped != 'true'
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Commit version bump to main
        if: steps.check.outputs.skipped != 'true'
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Pushed via env (not inline ${{ }}) so the token never lands in the
          # command echo; create-github-app-token also registers it as a masked
          # secret. Only the bump push uses it — the tag push below stays on
          # GITHUB_TOKEN so it does NOT trigger publish.yml (publish is invoked
          # by the explicit workflow_dispatch step further down).
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage every artifact the renderers touched. site/ is a glob
          # because render_site_markdown.py may rewrite multiple .md
          # files (docs/, blog/, mcp/, recommended-models/) on a single
          # bump; constraining to specific paths here would silently
          # drop a refreshed file from the bump commit.
          git add src/synth_panel/__version__.py site/index.html site/ \
                  site/.well-known/mcp/server-card.json
          if git diff --staged --quiet; then
            echo "Version artifacts already at ${NEW_TAG} (pre-bumped in PR) — nothing to commit."
          else
            VERSION="${NEW_TAG#v}"
            git commit -m "chore(release): sync __version__.py + rendered artifacts to ${VERSION} (PR #${PR_NUMBER}) (sy-hs4)"
            # Push as the release-bot App (Integration bypass actor on main).
            git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Create and push tag
        if: steps.check.outputs.skipped != 'true'
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG=$(printf 'Release %s (PR #%s: %s)' "$NEW_TAG" "$PR_NUMBER" "$PR_TITLE")
          # Tag the bump commit (or the unchanged HEAD if dev pre-bumped) so
          # the publish workflow, invoked at `--ref $NEW_TAG`, sees the
          # matching __version__.py.
          git tag -a "$NEW_TAG" -m "$MSG"
          git push origin "$NEW_TAG"

      - name: Create GitHub Release
        if: steps.check.outputs.skipped != 'true'
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${NEW_TAG#v}"
          gh release create "$NEW_TAG" --generate-notes --title "v$VERSION"

      # Dispatch publish.yml via workflow_dispatch at the tag ref.
      # Why not `uses: ./.github/workflows/publish.yml` (reusable workflow_call)?
      # A called workflow inherits the caller's ref — here refs/pull/N/merge —
      # which the `pypi` environment's deployment ref rule rejects. Dispatching
      # with --ref <tag> runs publish.yml at the tag ref, satisfying env
      # protection. Why not rely on `on: push: tags` in publish.yml? Tags pushed
      # via GITHUB_TOKEN do not trigger downstream workflows. workflow_dispatch
      # is an explicit exception to that policy, so no PAT is required.
      - name: Dispatch PyPI publish at tag ref
        if: steps.check.outputs.skipped != 'true'
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --ref "$NEW_TAG" -f tag="$NEW_TAG"
          echo "Dispatched Publish to PyPI at ref $NEW_TAG"
