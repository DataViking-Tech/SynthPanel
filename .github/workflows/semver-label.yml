name: Semver Label

# Pre-merge guard: every PR must carry exactly one semver:* label
# (semver:patch, semver:minor, semver:major, or semver:skip) BEFORE merge.
#
# The post-merge Auto Semver Tag workflow (auto-tag.yml) fails loud when a
# merged PR lacks a label — but by then the omission has already shipped and
# needs a manual label + rerun to recover. This check surfaces the same
# requirement on the PR itself, while it can still be fixed with one click.
# It is wired as a required status check on main separately (branch ruleset,
# managed in dataviking-infra) — this file only defines the check.
#
# Labels are fetched fresh from the API, not read from the event payload.
# Label events don't move the head SHA, and reruns replay the original
# payload — a payload-based `opened` run that failed before the label was
# added could never be manually rerun to green.
#
# A failed `opened` run superseded moments later by a green `labeled` run
# is harmless: both GitHub's merge box and auto-tag.yml's verify step
# (.github/scripts/verify-ci-checks.sh) evaluate only the LATEST run per
# check name on the SHA. This workflow briefly (PR #584) carried a
# self-heal step that re-ran superseded non-green runs of itself so they
# wouldn't block auto-tag — dead weight once the verify step stopped
# counting superseded runs, so it was removed (with its actions:write
# permission).
#
# No concurrency/cancel-in-progress: runs take ~2 seconds, and the newest
# run wins everywhere that matters anyway.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  semver-label:
    name: Semver Label
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one semver label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LABELS_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels?per_page=100" --jq '[.[].name]')
          echo "PR labels (fresh fetch): ${LABELS_JSON}"

          SEMVER_LABELS=$(echo "$LABELS_JSON" | jq -r '.[] | select(startswith("semver:"))')
          COUNT=$(echo "$SEMVER_LABELS" | grep -c . || true)

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No semver label on this PR. Add exactly one of: semver:patch, semver:minor, semver:major, semver:skip."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Multiple semver labels found: $(echo "$SEMVER_LABELS" | tr '\n' ' '). Use exactly one."
            exit 1
          fi

          case "$SEMVER_LABELS" in
            semver:patch|semver:minor|semver:major|semver:skip)
              echo "Semver label OK: $SEMVER_LABELS"
              ;;
            *)
              echo "::error::Unrecognized semver label '$SEMVER_LABELS'. Valid labels: semver:patch, semver:minor, semver:major, semver:skip."
              exit 1
              ;;
          esac
