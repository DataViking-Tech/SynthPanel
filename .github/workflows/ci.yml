name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "pr/gh-*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Mypy
        run: mypy src/althing/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: pip-audit
        # CVE-2026-3219 affects pip 26.0.1 (the runner default); fix in pip 26.1.
        # CVE-2026-6357 affects pip 26.0.1; fix also in pip 26.1.
        # Both ignored until the runner image picks up patched pip, then drop.
        # Tracking: https://nvd.nist.gov/vuln/detail/CVE-2026-3219
        # Tracking: https://nvd.nist.gov/vuln/detail/CVE-2026-6357
        #
        # `--skip-editable` excludes the `althing` package itself (installed
        # via `pip install -e .`). The audit is meant to catch dependency
        # vulnerabilities, not vulnerabilities in the package being audited —
        # and the latter would also fail "not found on PyPI" on release commits
        # before the version actually ships.
        run: pip-audit --skip-editable --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Run tests with coverage
        run: pytest tests/ -x --ignore=tests/test_acceptance.py --cov=althing --cov-report=term --cov-fail-under=80

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Run tests with coverage
        run: |
          pytest tests/ --ignore=tests/test_acceptance.py \
            --cov=althing --cov-report=term-missing --cov-report=html \
            | tee coverage-output.txt

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No coverage data" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: htmlcov/

  site-cli-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Check site/CLI subcommand sync
        run: python scripts/check_site_cli_sync.py

  site-tailwind-drift:
    # gh-563: site/assets/tailwind.css is precompiled and committed because
    # Cloudflare Pages deploys site/ raw (no build step). This job rebuilds
    # the stylesheet with the pinned toolchain (scripts/site_tailwind/) and
    # fails if the committed file drifts from the class usage in
    # site/**/*.html — the byte-for-byte counterpart to the pure-Python
    # coverage guard in tests/test_site_tailwind.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/site_tailwind/package-lock.json

      - name: Rebuild site/assets/tailwind.css
        working-directory: scripts/site_tailwind
        run: |
          npm ci
          npm run build

      - name: Fail on drift
        run: |
          git diff --exit-code -- site/assets/tailwind.css || {
            echo "::error::site/assets/tailwind.css is out of sync with site HTML class usage."
            echo "Regenerate: cd scripts/site_tailwind && npm ci && npm run build"
            exit 1
          }

  synthbench-contract:
    # Cross-repo contract gate (sp-ezz / gap-analysis P0-2): every
    # --submit-to-synthbench payload must pass SynthBench's real
    # validate_submission() with zero errors in tier 1 AND tier 2. The
    # matrix `test` job skips these tests (pytest.importorskip) because
    # the real synthbench harness is GitHub-only — the `synthbench` name
    # on PyPI is an unrelated project — so this job installs the harness
    # from git and runs the contract suite for real on every push/PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Install the real SynthBench harness (GitHub-only)
        # Installed after althing so its `althing>=0.2.0` dependency
        # is already satisfied by the editable install and pip does not
        # pull a published althing wheel over the checkout.
        # NOTE: the dist name is synthbench-eval (the bare `synthbench` name on
        # PyPI belongs to an unrelated project); pip >= 25 hard-errors on a
        # requested-name/metadata mismatch, so the requirement must use the
        # real dist name. The import package is still `synthbench`.
        run: pip install "synthbench-eval @ git+https://github.com/DataViking-Tech/SynthBench.git"

      - name: Run the submission contract tests against synthbench validate()
        run: pytest tests/test_synthbench_contract.py -v --no-cov

  install-smoke:
    # Guards the *source/uv resolution* path agents and contributors hit
    # when they clone the repo. The historical `composio>=0.5,<0.6` pin
    # silently broke when upstream yanked the 0.5.x line; this job
    # catches that class of resolver friction before it hits a first-time
    # contributor. Each extra is resolved in its own fresh venv so a
    # failure points at the specific extra. See sy-4c9 / gh-470 for
    # background.
    #
    # Complements `clean-install-smoke` / `clean-install-pipx` below
    # (sy-6kr), which validate the *built wheel* runtime CLI from PyPI's
    # perspective. Different failure modes — keep both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: pip install "uv>=0.4"

      - name: Resolve core source install (pip)
        run: |
          python -m venv /tmp/venv-core
          /tmp/venv-core/bin/pip install --upgrade pip
          /tmp/venv-core/bin/pip install -e .

      - name: Resolve core source install (uv)
        run: |
          uv venv /tmp/venv-core-uv
          uv pip install --python /tmp/venv-core-uv/bin/python -e .

      - name: Resolve each optional extra (uv)
        run: |
          set -euo pipefail
          for extra in mcp composio convergence pdf full visual; do
            echo "::group::extra=$extra"
            uv venv "/tmp/venv-$extra"
            uv pip install --python "/tmp/venv-$extra/bin/python" -e ".[$extra]"
            echo "::endgroup::"
          done

  clean-install-smoke:
    # sy-6kr: prove `pip install althing` (no source checkout) yields
    # a working CLI from a fresh environment. The matrix exercises the
    # two wheel-from-PyPI agent-onboarding paths (bare wheel, `[mcp]`
    # extra); pipx gets its own job below. Failures here surface as
    # dependency-resolver confusion or broken entry points to end users —
    # we want them to fail in CI instead of in someone's first session.
    #
    # Complements `install-smoke` above (sy-4c9), which validates
    # resolver behaviour across *every* extra from source. This job
    # exercises the runtime CLI off the built wheel instead.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        install:
          - { name: "pip (no extras)", extras: "" }
          - { name: "pip [mcp]",       extras: "[mcp]" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Build wheel
        run: |
          pip install --upgrade build
          python -m build --wheel

      - name: Show built artifact
        run: ls -lh dist/

      - name: Fresh venv install + smoke (${{ matrix.install.name }})
        env:
          # Use a fake key so `doctor`'s "credentials present" check
          # passes without ever calling a provider. The smoke commands
          # never make network requests; we just want exit code 0.
          ANTHROPIC_API_KEY: fake-key-for-smoke-test
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          WHEEL=$(ls dist/althing-*.whl)
          /tmp/smoke/bin/python -m pip install "${WHEEL}${{ matrix.install.extras }}"

          # No source directory is on the path — `althing` resolves
          # only via the wheel. If any of these fail, the install path
          # is broken for new users.
          /tmp/smoke/bin/althing --version
          /tmp/smoke/bin/althing --help > /dev/null
          /tmp/smoke/bin/althing whoami

          # sy-e28: prove the no-credentials install-only mode works in a
          # clean wheel install. Unset the fake key for this step so it
          # actually exercises the "credentials missing" path; exit code
          # must still be 0 because install_ok dominates.
          env -u ANTHROPIC_API_KEY /tmp/smoke/bin/althing doctor --install-only

          /tmp/smoke/bin/althing doctor

          # `[mcp]` matrix entry must additionally import the MCP server.
          if [ -n "${{ matrix.install.extras }}" ]; then
            /tmp/smoke/bin/python -c "from althing.mcp.server import mcp; print('mcp server import OK')"
          fi

  clean-install-pipx:
    # sy-6kr: pipx is the canonical "I just want the CLI globally" path
    # for agent onboarding. Worth its own job because pipx's isolated
    # venv layout differs from a plain `python -m venv` install, and we
    # want to catch any pipx-only regression (entry-point shimming,
    # data-file shipping) before it hits PyPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Build wheel
        run: |
          pip install --upgrade build
          python -m build --wheel

      - name: Install via pipx + smoke
        env:
          ANTHROPIC_API_KEY: fake-key-for-smoke-test
        run: |
          set -euo pipefail
          pip install --upgrade pipx
          python -m pipx ensurepath
          WHEEL=$(ls dist/althing-*.whl)
          # `--python` keeps pipx pinned to the runner's 3.14; the default
          # would otherwise reach for the system python.
          python -m pipx install --python "$(which python)" "${WHEEL}"
          # pipx installs to ~/.local/bin by default.
          export PATH="$HOME/.local/bin:$PATH"
          althing --version
          althing --help > /dev/null
          althing whoami
          althing doctor
