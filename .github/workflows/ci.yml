name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "pr/gh-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Mypy
        run: mypy src/synth_panel/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: pip-audit
        # CVE-2026-3219 affects pip 26.0.1 (the runner default); fix in pip 26.1.
        # CVE-2026-6357 affects pip 26.0.1; fix also in pip 26.1.
        # Both ignored until the runner image picks up patched pip, then drop.
        # Tracking: https://nvd.nist.gov/vuln/detail/CVE-2026-3219
        # Tracking: https://nvd.nist.gov/vuln/detail/CVE-2026-6357
        #
        # `--skip-editable` excludes the `synthpanel` package itself (installed
        # via `pip install -e .`). The audit is meant to catch dependency
        # vulnerabilities, not vulnerabilities in the package being audited —
        # and the latter would also fail "not found on PyPI" on release commits
        # before the version actually ships.
        run: pip-audit --skip-editable --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Run tests with coverage
        run: pytest tests/ -x --ignore=tests/test_acceptance.py --cov=synth_panel --cov-report=term --cov-fail-under=80

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Run tests with coverage
        run: |
          pytest tests/ --ignore=tests/test_acceptance.py \
            --cov=synth_panel --cov-report=term-missing --cov-report=html \
            | tee coverage-output.txt

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No coverage data" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: htmlcov/

  site-cli-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Check site/CLI subcommand sync
        run: python scripts/check_site_cli_sync.py

  install-smoke:
    # Guards the source/uv install paths agents and contributors actually
    # use. The historical `composio>=0.5,<0.6` pin silently broke when
    # upstream yanked the 0.5.x line; this job catches that class of
    # resolver friction before it hits a first-time contributor. Each
    # extra is resolved in its own fresh venv so a failure points at the
    # specific extra. See sy-4c9 / gh-470 for background.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: pip install "uv>=0.4"

      - name: Resolve core source install (pip)
        run: |
          python -m venv /tmp/venv-core
          /tmp/venv-core/bin/pip install --upgrade pip
          /tmp/venv-core/bin/pip install -e .

      - name: Resolve core source install (uv)
        run: |
          uv venv /tmp/venv-core-uv
          uv pip install --python /tmp/venv-core-uv/bin/python -e .

      - name: Resolve each optional extra (uv)
        run: |
          set -euo pipefail
          for extra in mcp composio convergence pdf full visual; do
            echo "::group::extra=$extra"
            uv venv "/tmp/venv-$extra"
            uv pip install --python "/tmp/venv-$extra/bin/python" -e ".[$extra]"
            echo "::endgroup::"
          done
