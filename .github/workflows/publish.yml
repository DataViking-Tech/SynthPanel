name: Publish to PyPI

# Tag-triggered publish to PyPI using GitHub Trusted Publishing (OIDC).
# No API token required — PyPI verifies the workflow identity via OIDC.
#
# Trusted publisher must be registered at
# https://pypi.org/manage/project/althing/settings/publishing/ with:
#   owner       = DataViking-Tech
#   repo        = Althing
#   workflow    = publish.yml
#   environment = pypi
#
# Triggers:
#   - push of a v*.*.* tag (auto-tag.yml creates these on PR merge)
#   - workflow_dispatch (manual republish for failure recovery)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish (e.g. v1.5.0). Informational — actual ref is the workflow ref."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: python-publish-althing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Build synthpanel shim dist (rename transition)
        # Metapackage that keeps `pip install synthpanel` working by
        # depending on althing. Built into the same dist/ so the publish
        # step uploads both; PyPI routes each file to its own project.
        run: python -m build --outdir dist/ shim-dist/

      - name: Show built artifacts
        run: ls -lh dist/

      # Trusted Publishing — no API token needed; PyPI verifies the GitHub
      # workflow's OIDC identity. skip-existing: true makes retries idempotent.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          skip-existing: true

      - name: Summarize
        env:
          REF: ${{ github.ref_name }}
        run: |
          {
            echo "## Published althing ${REF#v}"
            echo ""
            echo "- PyPI: https://pypi.org/project/althing/${REF#v}/"
            echo "- Install: \`pip install althing==${REF#v}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # npm namespace package (npm/). Publishes via npm Trusted Publishing (OIDC)
  # — no token. Trusted publisher must be registered on npmjs.com for the
  # `althing` package with:
  #   organization = DataViking-Tech
  #   repository   = Althing
  #   workflow     = publish.yml
  #   environment  = pypi
  # Skips cleanly when npm/package.json's version is already published, so
  # tag-driven Python releases don't fail on an unchanged placeholder.
  publish-npm:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm >= 11.5 (OIDC trusted publishing support)
        run: npm install -g npm@latest && npm --version

      - name: Publish npm package if version is new
        working-directory: npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME" version 2>/dev/null || echo "none")
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "npm: $NAME@$LOCAL already published — skipping."
          else
            npm publish
          fi
